<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluaciones de Desempeño</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="config.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#111;font-size:16px;line-height:1.7}
button{cursor:pointer;font-family:inherit;font-size:15px;border:0.5px solid #ccc;border-radius:8px;padding:10px 20px;background:#fff;color:#111;transition:background 0.15s}
button:hover{background:#f0f0f0}
button.primary{background:#1F4E79;color:#fff;border-color:#1F4E79}
button.primary:hover{background:#163a5a}
button.danger{background:#fff;color:#c0392b;border-color:#c0392b}
button.danger:hover{background:#fdf2f2}
button.small{padding:6px 14px;font-size:13px}
button:disabled{opacity:0.5;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:15px;border:0.5px solid #ccc;border-radius:8px;padding:10px 12px;background:#fff;color:#111;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1F4E79;box-shadow:0 0 0 2px rgba(31,78,121,0.15)}
textarea{resize:vertical;min-height:130px}
label{font-size:14px;font-weight:500;color:#555;display:block;margin-bottom:6px}
.card{background:#fff;border:0.5px solid #e5e5e5;border-radius:12px;padding:1rem 1.25rem}
.nav{background:#fff;border-bottom:0.5px solid #e5e5e5;padding:0 1.25rem;display:flex;align-items:center;height:58px;position:sticky;top:0;z-index:10}
.nav-tab{height:58px;padding:0 18px;border:none;border-radius:0;border-bottom:2px solid transparent;background:transparent;font-size:15px;color:#666;display:flex;align-items:center}
.nav-tab:hover{background:#f5f5f5;color:#111}
.nav-tab.active{border-bottom:2px solid #1F4E79;color:#1F4E79;font-weight:500}
.nav-brand{font-weight:500;font-size:16px;color:#1F4E79;margin-right:20px;white-space:nowrap}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:500}
.badge-ok{background:#EAF3DE;color:#3B6D11}
.badge-info{background:#E6F1FB;color:#185FA5}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.section-title{font-size:15px;font-weight:500;color:#1F4E79;border-left:3px solid #1F4E79;padding-left:8px;margin:1.5rem 0 1rem}
.eval-q{font-size:14px;font-style:italic;color:#444;margin-bottom:10px;font-weight:500}
.pregunta-bloque{border:0.5px solid #e5e5e5;border-radius:8px;padding:16px;margin-bottom:14px;background:#fafafa}
.emp-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0.5px solid #e5e5e5;border-radius:8px;background:#fff;margin-bottom:8px}
.avatar{width:44px;height:44px;border-radius:50%;background:#D6E4F0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:#1F4E79;flex-shrink:0}
.hist-table{width:100%;border-collapse:collapse}
.hist-table th{font-size:13px;font-weight:500;color:#777;text-align:left;padding:10px 14px;border-bottom:0.5px solid #e5e5e5;background:#fafafa}
.hist-table td{font-size:15px;padding:12px 14px;border-bottom:0.5px solid #f0f0f0;vertical-align:middle}
.hist-table tr:last-child td{border-bottom:none}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:2rem 1rem;overflow-y:auto}
.modal{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:460px;border:0.5px solid #e5e5e5}
.steps{display:flex;margin-bottom:1.5rem;border-bottom:0.5px solid #e5e5e5;overflow-x:auto}
.step{flex:1;min-width:32px;padding:10px 4px;text-align:center;font-size:13px;color:#999;border-bottom:2px solid transparent;cursor:pointer}
.step.done{color:#555;border-bottom:2px solid #ccc}
.step.active{color:#1F4E79;font-weight:500;border-bottom:2px solid #1F4E79}
.progress-bar{height:3px;background:#e5e5e5;border-radius:2px;margin-bottom:1rem;overflow:hidden}
.progress-fill{height:100%;background:#1F4E79;transition:width 0.3s}
.empty-state{text-align:center;padding:3rem 1rem;color:#777}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:#1F4E79;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1F4E79;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;animation:fadein 0.2s}
.toast.error{background:#c0392b}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.sql-block{background:#1e1e2e;color:#cdd6f4;border-radius:8px;padding:1rem;font-size:12px;font-family:monospace;white-space:pre;overflow-x:auto;margin:8px 0;line-height:1.6}
/* Niveles */
.niveles{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.nivel-btn{padding:6px 14px;font-size:13px;font-weight:500;border-radius:20px;border:1.5px solid transparent;cursor:pointer;transition:all 0.15s;background:#fff}
.nivel-btn:hover{filter:brightness(0.93)}
.nivel-excelente{border-color:#1E7145;color:#1E7145}
.nivel-excelente.sel{background:#1E7145;color:#fff}
.nivel-muy-bueno{border-color:#2E75B6;color:#2E75B6}
.nivel-muy-bueno.sel{background:#2E75B6;color:#fff}
.nivel-bueno{border-color:#375623;color:#375623}
.nivel-bueno.sel{background:#375623;color:#fff}
.nivel-regular{border-color:#C55A11;color:#C55A11}
.nivel-regular.sel{background:#C55A11;color:#fff}
.nivel-malo{border-color:#c0392b;color:#c0392b}
.nivel-malo.sel{background:#c0392b;color:#fff}
.nivel-tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:500;margin-left:6px}
</style>
</head>
<body>
<div id="root"></div>
<script>
var React_useState   = React.useState;
var React_useEffect  = React.useEffect;
var React_useRef     = React.useRef;
var useState   = React_useState;
var useEffect  = React_useEffect;
var useRef     = React_useRef;
var ce = React.createElement;
var {createRoot} = ReactDOM;

// ── NIVELES ───────────────────────────────────────────────────────────────────
var NIVELES = [
  { id:"excelente",  label:"Excelente",  cls:"nivel-excelente",  color:"1E7145" },
  { id:"muy-bueno",  label:"Muy bueno",  cls:"nivel-muy-bueno",  color:"2E75B6" },
  { id:"bueno",      label:"Bueno",      cls:"nivel-bueno",      color:"375623" },
  { id:"regular",    label:"Regular",    cls:"nivel-regular",    color:"C55A11" },
  { id:"malo",       label:"Malo",       cls:"nivel-malo",       color:"c0392b" }
];
var NIVEL_MAP = {};
NIVELES.forEach(function(n){ NIVEL_MAP[n.id] = n; });

// ── CONFIGURACIÓN ─────────────────────────────────────────────────────────────
// SUPABASE_URL y SUPABASE_ANON se definen en config.js

// ── CLIENTE REST ──────────────────────────────────────────────────────────────
function sbFetch(method, path, body) {
  return fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method: method,
    headers: {
      "apikey": SUPABASE_ANON,
      "Authorization": "Bearer " + SUPABASE_ANON,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    },
    body: body ? JSON.stringify(body) : undefined
  }).then(function(res) {
    if (!res.ok) return res.text().then(function(t){ throw new Error(t); });
    return res.text().then(function(t){ return t ? JSON.parse(t) : []; });
  });
}
var sb = {
  get:   function(p)    { return sbFetch("GET",    p, null); },
  post:  function(p, b) { return sbFetch("POST",   p, b);    },
  patch: function(p, b) { return sbFetch("PATCH",  p, b);    },
  del:   function(p)    { return sbFetch("DELETE", p, null); }
};

// ── CUESTIONARIO ──────────────────────────────────────────────────────────────
var SECCIONES = [
  {id:"organizacion", titulo:"Organización", preguntas:[
    "¿Sabe distinguir entre temas importantes y temas urgentes?",
    "¿Tiene la programación hecha con buen criterio?",
    "¿El empleado distribuye de manera adecuada y efectiva el tiempo para cada tarea que realiza?",
    "¿Cuenta con un plan o estrategia para llevar a cabo cada actividad?"
  ]},
  {id:"responsabilidad", titulo:"Responsabilidad", preguntas:[
    "Cumple con las normas básicas de la empresa: puntualidad, horarios, orden y limpieza, programación…",
    "¿Cumple con los plazos establecidos y con su programación?",
    "¿Se entregan en tiempo y forma las tareas asignadas?",
    "¿Hay interés de asumir labores extra por voluntad propia?"
  ]},
  {id:"conducta", titulo:"Conducta", preguntas:[
    "¿El colaborador trabaja con ética en cada actividad realizada?",
    "¿Es honesto cuando piden su opinión o cuando es necesario darla?"
  ]},
  {id:"recursos", titulo:"Manejo de Recursos", preguntas:[
    "¿Dispone de todos los recursos y herramientas necesarias para realizar su trabajo?",
    "¿Usa eficazmente el espacio y equipos de trabajo?",
    "¿Saca el mayor provecho de todas las herramientas que les ofrece la empresa?",
    "¿Ha propuesto o hecho algo para ahorrar o reducir costos en el uso de los recursos?"
  ]},
  {id:"interaccion", titulo:"Interacción con Compañeros", preguntas:[
    "¿Influye de manera positiva o negativa la convivencia con sus compañeros, jefes, subordinados, clientes, proveedores, etc.?"
  ]},
  {id:"compromiso", titulo:"Compromiso", preguntas:[
    "¿El empleado está comprometido con los objetivos de la organización?",
    "¿Sus acciones van de acuerdo a la misión, visión y valores de la compañía?"
  ]},
  {id:"contribucion", titulo:"Contribución", preguntas:[
    "¿Las habilidades técnicas, profesionales o personales contribuyen positivamente para cumplir los objetivos del negocio?"
  ]},
  {id:"cooperacion", titulo:"Cooperación", preguntas:[
    "¿El empleado está abierto a cooperar con otros miembros de la organización?",
    "¿Sabe trabajar en equipo y ve por los demás?"
  ]},
  {id:"conflictos", titulo:"Manejo de Conflictos", preguntas:[
    "¿Cómo reacciona el colaborador cuando hay un problema en su equipo de trabajo o en la organización?",
    "¿Propone soluciones a los conflictos?"
  ]},
  {id:"cambio", titulo:"Manejo del Cambio", preguntas:[
    "¿Cómo reacciona ante los cambios?",
    "¿Se adapta a las eventualidades que se presentan día a día?",
    "¿Es capaz de asumir un rol de más responsabilidad?"
  ]},
  {id:"objetivos", titulo:"Cumplimiento de Objetivos", preguntas:[
    "¿Cumple totalmente, parcialmente o no cumple sus objetivos?",
    "En caso de no cumplir: causas, debilidades, necesidades…"
  ]}
];
var TOTAL_PREGUNTAS = SECCIONES.reduce(function(a,s){ return a+s.preguntas.length; }, 0);

function initRespuestas() {
  var r = {};
  SECCIONES.forEach(function(s) {
    s.preguntas.forEach(function(_, i) {
      r[s.id+"_"+i] = "";
      r[s.id+"_"+i+"_nivel"] = "";
    });
  });
  return r;
}

function getIniciales(n){ return (n||"?").split(" ").slice(0,2).map(function(p){return p[0];}).join("").toUpperCase(); }
function formatDate(iso){ if(!iso)return""; var d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function contarRespuestas(r){ return Object.keys(r||{}).filter(function(k){ return k.indexOf("_nivel")===-1 && (r[k]||"").trim()!==""}).length; }

// ── CALCULAR RESUMEN POR SECCIÓN ──────────────────────────────────────────────
function calcularResumenSecciones(respuestas) {
  var peso = { "excelente":5, "muy-bueno":4, "bueno":3, "regular":2, "malo":1 };
  var resultado = [];
  SECCIONES.forEach(function(sec) {
    var niveles = [];
    sec.preguntas.forEach(function(_, i) {
      var nv = (respuestas||{})[sec.id+"_"+i+"_nivel"];
      if (nv && peso[nv]) niveles.push(peso[nv]);
    });
    var media = niveles.length ? niveles.reduce(function(a,b){return a+b;},0)/niveles.length : null;
    var nivelLabel = null;
    if (media !== null) {
      if (media >= 4.5) nivelLabel = "excelente";
      else if (media >= 3.5) nivelLabel = "muy-bueno";
      else if (media >= 2.5) nivelLabel = "bueno";
      else if (media >= 1.5) nivelLabel = "regular";
      else nivelLabel = "malo";
    }
    resultado.push({ titulo: sec.titulo, nivel: nivelLabel, media: media });
  });
  return resultado;
}

// ── GENERAR WORD ──────────────────────────────────────────────────────────────
function generarInforme(nombre, puesto, departamento, fecha, respuestas) {
  var docx = window.docx;
  if (!docx) { alert("La librería Word aún no ha cargado, espera un momento."); return; }

  var AZUL = "1F4E79";
  var AZUL_CLARO = "D6E4F0";
  var bd = { style: docx.BorderStyle.SINGLE, size: 1, color: "CCCCCC" };
  var borders = { top:bd, bottom:bd, left:bd, right:bd };
  var noBd = { style: docx.BorderStyle.NONE, size: 0, color: "FFFFFF" };
  var noBorders = { top:noBd, bottom:noBd, left:noBd, right:noBd };

  function par(texto, opts) {
    opts = opts||{};
    return new docx.Paragraph({
      children:[new docx.TextRun(Object.assign({text:texto,font:"Arial",size:opts.size||22},opts.run||{}))],
      alignment:opts.align||docx.AlignmentType.LEFT,
      spacing:{before:opts.before||80,after:opts.after||80}
    });
  }
  function titulo1(texto) {
    return new docx.Paragraph({
      children:[new docx.TextRun({text:texto,bold:true,size:28,color:AZUL,font:"Arial"})],
      spacing:{before:360,after:160},
      border:{bottom:{style:docx.BorderStyle.SINGLE,size:6,color:AZUL,space:1}}
    });
  }
  function preguntaPar(texto) {
    return new docx.Paragraph({
      children:[new docx.TextRun({text:texto,italics:true,bold:true,size:20,color:"333333",font:"Arial"})],
      spacing:{before:160,after:40}
    });
  }
  function respuestaPar(texto) {
    return new docx.Paragraph({
      children:[new docx.TextRun({text:texto,size:20,font:"Arial"})],
      spacing:{before:0,after:120},
      alignment:docx.AlignmentType.JUSTIFIED,
      indent:{left:300}
    });
  }
  function nivelPar(nivelId) {
    if (!nivelId) return null;
    var nv = NIVEL_MAP[nivelId];
    if (!nv) return null;
    return new docx.Paragraph({
      children:[
        new docx.TextRun({text:"Valoración: ",italics:true,size:18,color:"777777",font:"Arial"}),
        new docx.TextRun({text:" "+nv.label+" ",bold:true,size:18,color:"FFFFFF",font:"Arial",
          shading:{type:docx.ShadingType.CLEAR,fill:nv.color}
        })
      ],
      spacing:{before:0,after:80},
      indent:{left:300}
    });
  }

  var hoy = new Date(fecha+"T12:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"long",year:"numeric"});

  // Tabla portada
  function filaPortada(etq, val, sombra) {
    return new docx.TableRow({children:[
      new docx.TableCell({borders:borders,width:{size:2800,type:docx.WidthType.DXA},
        shading:{fill:sombra?AZUL_CLARO:AZUL,type:docx.ShadingType.CLEAR},
        margins:{top:100,bottom:100,left:150,right:150},
        children:[new docx.Paragraph({children:[new docx.TextRun({text:etq,bold:true,size:20,font:"Arial",color:sombra?AZUL:"FFFFFF"})]})]
      }),
      new docx.TableCell({borders:borders,width:{size:4200,type:docx.WidthType.DXA},
        margins:{top:100,bottom:100,left:150,right:150},
        children:[new docx.Paragraph({children:[new docx.TextRun({text:val||"—",size:20,font:"Arial",bold:!sombra})]})]
      })
    ]});
  }

  // Tabla resumen final
  var resumen = calcularResumenSecciones(respuestas);
  var coloresNivel = {"excelente":"1E7145","muy-bueno":"2E75B6","bueno":"375623","regular":"C55A11","malo":"c0392b"};

  function filaResumen(titulo, nivelId) {
    var nv = nivelId ? NIVEL_MAP[nivelId] : null;
    return new docx.TableRow({children:[
      new docx.TableCell({borders:borders,width:{size:5500,type:docx.WidthType.DXA},
        shading:{fill:"F2F2F2",type:docx.ShadingType.CLEAR},
        margins:{top:80,bottom:80,left:150,right:150},
        children:[new docx.Paragraph({children:[new docx.TextRun({text:titulo,bold:true,size:20,font:"Arial"})]})]
      }),
      new docx.TableCell({borders:borders,width:{size:3860,type:docx.WidthType.DXA},
        shading:{fill: nv ? coloresNivel[nivelId] : "CCCCCC", type:docx.ShadingType.CLEAR},
        margins:{top:80,bottom:80,left:150,right:150},
        verticalAlign:docx.VerticalAlign.CENTER,
        children:[new docx.Paragraph({
          alignment:docx.AlignmentType.CENTER,
          children:[new docx.TextRun({text: nv ? nv.label : "Sin valoración",bold:true,size:20,font:"Arial",color:"FFFFFF"})]
        })]
      })
    ]});
  }

  // Calcular valoración global
  var pesoGlobal = {"excelente":5,"muy-bueno":4,"bueno":3,"regular":2,"malo":1};
  var todasLasMedias = resumen.filter(function(r){return r.media!==null;}).map(function(r){return r.media;});
  var mediaGlobal = todasLasMedias.length ? todasLasMedias.reduce(function(a,b){return a+b;},0)/todasLasMedias.length : null;
  var nivelGlobal = null;
  if (mediaGlobal!==null) {
    if (mediaGlobal>=4.5) nivelGlobal="excelente";
    else if (mediaGlobal>=3.5) nivelGlobal="muy-bueno";
    else if (mediaGlobal>=2.5) nivelGlobal="bueno";
    else if (mediaGlobal>=1.5) nivelGlobal="regular";
    else nivelGlobal="malo";
  }

  var tablaResumen = new docx.Table({
    width:{size:9360,type:docx.WidthType.DXA},
    columnWidths:[5500,3860],
    rows: [
      new docx.TableRow({children:[
        new docx.TableCell({borders:borders,width:{size:5500,type:docx.WidthType.DXA},
          shading:{fill:AZUL,type:docx.ShadingType.CLEAR},margins:{top:100,bottom:100,left:150,right:150},
          children:[new docx.Paragraph({children:[new docx.TextRun({text:"Competencia",bold:true,size:22,color:"FFFFFF",font:"Arial"})]})]
        }),
        new docx.TableCell({borders:borders,width:{size:3860,type:docx.WidthType.DXA},
          shading:{fill:AZUL,type:docx.ShadingType.CLEAR},margins:{top:100,bottom:100,left:150,right:150},
          children:[new docx.Paragraph({alignment:docx.AlignmentType.CENTER,children:[new docx.TextRun({text:"Valoración",bold:true,size:22,color:"FFFFFF",font:"Arial"})]})]
        })
      ]})
    ].concat(resumen.map(function(r){ return filaResumen(r.titulo, r.nivel); }))
     .concat(nivelGlobal ? [
       new docx.TableRow({children:[
         new docx.TableCell({borders:borders,width:{size:5500,type:docx.WidthType.DXA},
           shading:{fill:AZUL,type:docx.ShadingType.CLEAR},margins:{top:100,bottom:100,left:150,right:150},
           children:[new docx.Paragraph({children:[new docx.TextRun({text:"VALORACIÓN GLOBAL",bold:true,size:22,color:"FFFFFF",font:"Arial"})]})]
         }),
         new docx.TableCell({borders:borders,width:{size:3860,type:docx.WidthType.DXA},
           shading:{fill:coloresNivel[nivelGlobal]||"888888",type:docx.ShadingType.CLEAR},margins:{top:100,bottom:100,left:150,right:150},
           children:[new docx.Paragraph({alignment:docx.AlignmentType.CENTER,children:[new docx.TextRun({text:(NIVEL_MAP[nivelGlobal]||{}).label||"—",bold:true,size:22,color:"FFFFFF",font:"Arial"})]})]
         })
       ]})
     ] : [])
  });

  // Contenido secciones
  var secContent = [];
  SECCIONES.forEach(function(sec) {
    secContent.push(titulo1(sec.titulo));
    sec.preguntas.forEach(function(p, i) {
      var r = (respuestas||{})[sec.id+"_"+i]||"—";
      var nv = (respuestas||{})[sec.id+"_"+i+"_nivel"]||"";
      secContent.push(preguntaPar(p));
      var nvPar = nivelPar(nv);
      if (nvPar) secContent.push(nvPar);
      secContent.push(respuestaPar(r));
    });
    secContent.push(par("",{before:40,after:40}));
  });

  var tablaPortada = new docx.Table({
    width:{size:7000,type:docx.WidthType.DXA}, columnWidths:[2800,4200],
    rows:[filaPortada("Empleado evaluado",nombre,false),filaPortada("Puesto",puesto,true),filaPortada("Departamento",departamento,true),filaPortada("Fecha",hoy,true)]
  });

  var children = [
    par("EVALUACIÓN DE DESEMPEÑO",{run:{bold:true,size:52,color:AZUL},align:docx.AlignmentType.CENTER,before:400,after:120}),
    par("Informe para Dirección",{run:{size:28,color:"555555"},align:docx.AlignmentType.CENTER,before:0,after:400}),
    tablaPortada,
    par("",{before:400,after:100}),
    titulo1("RESUMEN DE VALORACIONES"),
    par("",{before:0,after:120}),
    tablaResumen,
    par("",{before:400,after:100}),
    titulo1("CUESTIONARIO DE EVALUACIÓN"),
    par("",{before:0,after:100})
  ].concat(secContent).concat([
    par("",{before:400,after:0}),
    new docx.Paragraph({

        ce("div",null,ce("label",null,"Empleado"),ce("select",{value:filtroEmp,onChange:function(e){setFiltroEmp(e.target.value);}},ce("option",{value:""},"Todos"),empleados.map(function(e){return ce("option",{key:e.id,value:e.id},e.nombre);}))),
        ce("div",null,ce("label",null,"Desde"),ce("input",{type:"date",value:filtroDesde,onChange:function(e){setFiltroDesde(e.target.value);}})),
        ce("div",null,ce("label",null,"Hasta"),ce("input",{type:"date",value:filtroHasta,onChange:function(e){setFiltroHasta(e.target.value);}}))

    loading?ce("div",{style:{textAlign:"center",padding:"2rem",color:"#777"}},ce("span",{className:"spinner"}),"Cargando..."):
    evals.length===0?ce("div",{className:"empty-state"},ce("div",{style:{fontSize:32,marginBottom:8}},"📋"),ce("p",null,"No hay evaluaciones que coincidan.")):
    ce("div",{className:"card",style:{padding:0,overflow:"hidden"}},
      ce("table",{className:"hist-table"},
        ce("thead",null,ce("tr",null,ce("th",null,"Fecha"),ce("th",null,"Empleado"),ce("th",null,"Puesto"),ce("th",null,"Progreso"),ce("th",null,""))),
        ce("tbody",null,evals.map(function(ev){
          return ce("tr",{key:ev.id},
            ce("td",null,formatDate(ev.fecha)),
            ce("td",null,ce("div",{style:{display:"flex",alignItems:"center",gap:8}},ce("div",{className:"avatar",style:{width:26,height:26,fontSize:10,flexShrink:0}},getIniciales(ev.empleado_nombre)),ev.empleado_nombre)),
            ce("td",{style:{color:"#555"}},ev.empleado_puesto||"—"),
            ce("td",null,ce("span",{className:"badge",style:{background:ev.completadas===ev.total?"#EAF3DE":"#FAEEDA",color:ev.completadas===ev.total?"#3B6D11":"#854F0B"}},ev.completadas+"/"+ev.total)),
            ce("td",null,ce("div",{style:{display:"flex",gap:4,justifyContent:"flex-end"}},
              ce("button",{className:"small",onClick:function(){setDetalle(ev);}},"Ver"),

}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  var s1=useState("empleados"); var tab=s1[0]; var setTab=s1[1];
  var s2=useState(null); var toast=s2[0]; var setToast=s2[1];
  var configured = typeof SUPABASE_URL!=="undefined" && SUPABASE_URL.indexOf("supabase.co")!==-1;
  function showToast(msg,type){ setToast({msg:msg,type:type||"ok",k:Date.now()}); }

  return ce(React.Fragment,null,
    ce("div",{className:"nav"},
      ce("span",{className:"nav-brand"},"📊 Evaluaciones"),
      configured?ce(React.Fragment,null,
        ce("button",{className:"nav-tab "+(tab==="empleados"?"active":""),onClick:function(){setTab("empleados");}},"Empleados"),
        ce("button",{className:"nav-tab "+(tab==="nueva"?"active":""),onClick:function(){setTab("nueva");}},"Nueva evaluación"),
        ce("button",{className:"nav-tab "+(tab==="historial"?"active":""),onClick:function(){setTab("historial");}},"Historial")
      ):null
    ),
    !configured?ce(ConfigScreen,null):ce(React.Fragment,null,
      tab==="empleados"?ce(EmpleadosTab,{toast:showToast}):null,
      tab==="nueva"?ce(NuevaEvalTab,{toast:showToast}):null,
      tab==="historial"?ce(HistorialTab,{toast:showToast}):null
    ),
    toast?ce(Toast,{key:toast.k,msg:toast.msg,type:toast.type,onDone:function(){setToast(null);}}):null
  );
}

createRoot(document.getElementById("root")).render(ce(App,null));
</script>
